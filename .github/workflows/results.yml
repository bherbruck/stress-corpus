name: Check results

on:
  pull_request:
    paths:
      - "results/**"
      - "tools/**"
      - "tests/**"
      - "items.jsonl"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tool tests
        run: python3 -m unittest discover -s tests
      - name: Check results files
        run: |
          python3 tools/check_results.py | tee check.txt
          python3 - <<'PY'
          import re
          for line in open("check.txt"):
              m = re.match(r"error: (.+?):(\d+): (.*)", line)
              if m:
                  print(f"::error file={m[1]},line={m[2]}::{m[3]}")
          PY
          ! grep -q '^error:' check.txt
